# This file is the only Spring config-data location for TradeApplicationIT.
# It intentionally imports no workspace/local configuration or credential files.
spring.config.import=
spring.application.name=trade-isolated-application-it
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=2
spring.rabbitmq.virtual-host=/
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3s
spring.mail.host=127.0.0.1
spring.mail.port=9
spring.mail.username=isolated-it@example.invalid
spring.mail.password=unused-test-only
spring.ai.openai.api-key=isolated-it-dummy-key
spring.ai.openai.base-url=http://127.0.0.1:9
spring.ai.openai.chat.options.model=isolated-test-model
mybatis.configuration.map-underscore-to-camel-case=true
sa-token.token-name=ticket-token
sa-token.timeout=3600
sa-token.is-log=false
trade.enabled=true
trade.legacy-consumers-enabled=false
alipay.app-id=isolated-it
alipay.merchant-private-key=unused-test-only
alipay.alipay-public-key=unused-test-only
alipay.gateway-url=http://127.0.0.1:9
alipay.notify-url=http://127.0.0.1:9/notify
alipay.return-url=http://127.0.0.1:9/return
wechat.test.app-id=isolated-it
wechat.test.app-secret=unused-test-only
wechat.test.redirect-uri=http://127.0.0.1:9/callback
logging.level.org.example.ticketmanagement=INFO
