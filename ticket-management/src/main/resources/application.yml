spring:
  application:
    name: ticket-management
  datasource:
    url: jdbc:mysql://localhost:3306/ticket
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: zyh790201
  data:
    redis:
      host: localhost
      port: 6379
      password:  # 如果有密码则填写
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8   # 连接池最大连接数
          max-idle: 8     # 连接池最大空闲连接数
          min-idle: 0     # 连接池最小空闲连接数
          max-wait: -1ms  # 连接池最大阻塞等待时间

  rabbitmq:
    host: localhost
    port: 5672
    username: tm
    password: 123456
    virtual-host: /tm
    # 开启生产者确认模式
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 消费者手动确认
        acknowledge-mode: manual
        # 消费失败重试
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

  mail:
    host: smtp.qq.com
    port: 587
    username: 3197209971@qq.com  # 你的邮箱
    password: cikiahobyowodghc  # 邮箱授权码，不是登录密码
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# Redisson配置
redisson:
  config: |
    singleServerConfig:
      address: "redis://localhost:6379"
      database: 0
      connectionMinimumIdleSize: 10
      connectionPoolSize: 64
      subscriptionConnectionPoolSize: 50
      timeout: 3000
      retryAttempts: 3
      retryInterval: 1500


# 微信测试号配置
wechat:
  test:
    app-id: wx94cd5b487e8b7509  # 替换为你的测试号AppID
    app-secret: 047b3810f687c2dfd2fd6033181345cf # 替换为你的测试号AppSecret
    redirect-uri: http://z569d97b.natappfree.cc/api/auth/wechat/callback  # 本地测试回调地址

# 验证码配置
verification:
  code:
    max-retry: 3        # 最大重试次数（默认3次）
    expire-time: 15     # 验证码过期时间（默认15分钟）
    send-interval: 60   # 发送间隔时间（默认60秒）
    length: 6           # 验证码长度（默认6位）

# SaToken 配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: ticket-token
  # token有效期，单位秒，默认30天，-1代表永不过期
  timeout: 2592000
  # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  active-timeout: 7200
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token
  is-share: true
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # 是否从cookie中读取token
  is-read-cookie: false
  # 是否从header中读取token
  is-read-header: true
  # 是否从body中读取token
  is-read-body: false
  # 是否在登录后自动生成token
  is-write-header: true
  # 日志级别
  log-level: info



# 添加支付宝配置
alipay:
  # 沙箱环境APPID（从支付宝沙箱后台获取）
  app-id: 9021000161666460
  # 商户私钥（你的应用私钥）
  merchant-private-key: |
    
  # 支付宝公钥（从沙箱后台获取）
  alipay-public-key: |
    
  # 支付宝网关（沙箱环境）
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  # 异步通知地址：使用 natapp 生成的公网地址，代码中动态传入，不需要在后台填
  notify-url: http://z569d97b.natappfree.cc/api/public/payments/notify

  # 同步返回地址：用户支付成功后跳转的页面
  # 如果你有前端页面，填写前端的地址
  # 如果没有，可以先填 natapp 地址测试
  return-url: http://z569d97b.natappfree.cc/payment/success
  # 或者填你的前端本地地址
  # return-url: http://localhost:5173/payment/success
  # 签名类型
  sign-type: RSA2
  # 字符集
  charset: UTF-8
  # 支付超时时间（分钟）
  timeout-minutes: 30
