spring:
  flyway:
    enabled: ${TRADE_MIGRATIONS_ENABLED:false}
    baseline-on-migrate: false
    clean-disabled: true
  config:
    import:
      - optional:file:./ticket-management/config/application-local.properties
      - optional:file:./config/application-local.properties

  application:
    name: ticket-management

  ai:
    openai:
      chat:
        options:
          model: qwen3.6-plus
      api-key: ${OPENAI_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode

  datasource:
    url: jdbc:mysql://localhost:3306/ticket
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  data:
    redis:
      host: localhost
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8   # 连接池最大连接数
          max-idle: 8     # 连接池最大空闲连接数
          min-idle: 0     # 连接池最小空闲连接数
          max-wait: -1ms  # 连接池最大阻塞等待时间

  rabbitmq:
    host: localhost
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:tm}
    password: ${SPRING_RABBITMQ_PASSWORD:}
    virtual-host: /tm
    # 开启生产者确认模式
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 消费者手动确认
        acknowledge-mode: manual
        # 消费失败重试
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

  mail:
    host: smtp.qq.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# Redisson配置
redisson:
  config: |
    singleServerConfig:
      address: "redis://localhost:6379" 
      database: 0
      connectionMinimumIdleSize: 10
      connectionPoolSize: 64
      subscriptionConnectionPoolSize: 50
      timeout: 3000
      retryAttempts: 3
      retryInterval: 1500

# 微信测试号配置
wechat:
  test:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    redirect-uri: ${WECHAT_REDIRECT_URI:http://localhost:8080/api/auth/wechat/callback}

# 验证码配置
verification:
  code:
    max-retry: 3        # 最大重试次数（默认3次）
    expire-time: 15     # 验证码过期时间（默认15分钟）
    send-interval: 60   # 发送间隔时间（默认60秒）
    length: 6           # 验证码长度（默认6位）

# SaToken 配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: ticket-token
  # token有效期，单位秒，默认30天，-1代表永不过期
  timeout: 2592000
  # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  active-timeout: 7200
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token
  is-share: true
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # 是否从cookie中读取token
  is-read-cookie: false
  # 是否从header中读取token
  is-read-header: true
  # 是否从body中读取token
  is-read-body: false
  # 是否在登录后自动生成token
  is-write-header: true
  # 日志级别
  log-level: info



# 添加支付宝配置
alipay:
  # 沙箱环境APPID（从支付宝沙箱后台获取）
  app-id: ${ALIPAY_APP_ID:}
  # 应用私钥：本地请求签名；配对的应用公钥只需上传支付宝平台
  merchant-private-key: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
  # 支付宝公钥（从沙箱后台获取）
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  # 支付宝网关（沙箱环境）
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  # 支付异步通知地址：沙箱联调时使用能访问隔离应用的公网地址，正式环境使用 HTTPS
  notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8080/api/public/payments/notify}

  # 支付同步回跳地址：纯后端项目使用 /api/public/payments/return
  # 回跳仅供展示，付款结果以异步通知和渠道查单为准
  return-url: ${ALIPAY_RETURN_URL:http://localhost:8080/api/public/payments/return}
  # 签名类型
  sign-type: RSA2
  # 字符集
  charset: UTF-8
  # 支付超时时间（分钟）
  timeout-minutes: 30

logging:
  level:
    org.springframework.ai.chat.client.advisor: debug

# Enable only after controlled migration and old-consumer shutdown.
trade:
  enabled: ${TRADE_ENABLED:false}
  legacy-consumers-enabled: false

# Redis预扣协议；消费者和恢复任务均有界运行，不以配置值宣称实测性能。
seckill:
  lock:
    enabled: ${SECKILL_LOCK_ENABLED:true}
    segments: ${SECKILL_LOCK_SEGMENTS:20}
    wait-millis: ${SECKILL_LOCK_WAIT_MILLIS:200}
  consumer:
    concurrent: ${SECKILL_CONSUMER_CONCURRENT:3}
    max-concurrent: ${SECKILL_CONSUMER_MAX_CONCURRENT:10}
    prefetch: ${SECKILL_CONSUMER_PREFETCH:10}
  order:
    coordination-enabled: ${SECKILL_ORDER_COORDINATION_ENABLED:true}
    lock-wait-millis: ${SECKILL_ORDER_LOCK_WAIT_MILLIS:2000}
  recovery:
    provisional-delay-millis: ${SECKILL_PROVISIONAL_DELAY_MILLIS:5000}
    order-delay-millis: ${SECKILL_ORDER_RECOVERY_DELAY_MILLIS:60000}
