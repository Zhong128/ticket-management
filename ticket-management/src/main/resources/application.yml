spring:
  application:
    name: ticket-management
  datasource:
    url: jdbc:mysql://localhost:3306/ticket
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: zyh790201
  data:
    redis:
      host: localhost
      port: 6379
      password:  # 如果有密码则填写
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8   # 连接池最大连接数
          max-idle: 8     # 连接池最大空闲连接数
          min-idle: 0     # 连接池最小空闲连接数
          max-wait: -1ms  # 连接池最大阻塞等待时间

  rabbitmq:
    host: localhost
    port: 5672
    username: tm
    password: 123456
    virtual-host: /tm
    # 开启生产者确认模式
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 消费者手动确认
        acknowledge-mode: manual
        # 消费失败重试
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

  mail:
    host: smtp.qq.com
    port: 587
    username: your-email@qq.com  # 你的邮箱
    password: your-authorization-code  # 邮箱授权码，不是登录密码
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# Redisson配置
redisson:
  config: |
    singleServerConfig:
      address: "redis://localhost:6379"
      database: 0
      connectionMinimumIdleSize: 10
      connectionPoolSize: 64
      subscriptionConnectionPoolSize: 50
      timeout: 3000
      retryAttempts: 3
      retryInterval: 1500


# 微信测试号配置
wechat:
  test:
    app-id: wx94cd5b487e8b7509  # 替换为你的测试号AppID
    app-secret: 047b3810f687c2dfd2fd6033181345cf # 替换为你的测试号AppSecret
    redirect-uri: http://e269359e.natappfree.cc/api/auth/wechat/callback  # 本地测试回调地址

# 验证码配置
verification:
  code:
    max-retry: 3        # 最大重试次数（默认3次）
    expire-time: 15     # 验证码过期时间（默认15分钟）
    send-interval: 60   # 发送间隔时间（默认60秒）
    length: 6           # 验证码长度（默认6位）

# SaToken 配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: ticket-token
  # token有效期，单位秒，默认30天，-1代表永不过期
  timeout: 2592000
  # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  active-timeout: 7200
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token
  is-share: true
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # 是否从cookie中读取token
  is-read-cookie: false
  # 是否从header中读取token
  is-read-header: true
  # 是否从body中读取token
  is-read-body: false
  # 是否在登录后自动生成token
  is-write-header: true
  # 使用Redis存储token（如果启用Redis）
  is-read-redis: true

  # 账号封禁配置
  disable:
    # 是否开启账号封禁功能
    is-disabled: true
    # 账号封禁服务实现类
    disable-service-impl: org.example.ticketmanagement.service.impl.SaDisableServiceImpl

  # 二级认证配置
  safe:
    # 是否开启二级认证
    is-safe: false
    # 二级认证有效时间，单位秒
    safe-time: 120

  # 注解校验配置
  check:
    # 是否打印注解校验日志
    is-log: false

  # JWT集成配置（如果需要）
  jwt:
    # jwt秘钥
    secret-key: ticket-management-secret-key-2024
    # 是否开启JWT
    is-enabled: false
